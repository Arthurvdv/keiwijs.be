name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      functionAppName: ${{ steps.out.outputs.functionAppName }}
      functionAppHostName: ${{ steps.out.outputs.functionAppHostName }}
      storageAccountName: ${{ steps.out.outputs.storageAccountName }}
      staticWebsiteEndpoint: ${{ steps.out.outputs.staticWebsiteEndpoint }}
      staticWebAppName: ${{ steps.out.outputs.staticWebAppName }}
      staticWebAppDefaultHostname: ${{ steps.out.outputs.staticWebAppDefaultHostname }}
    steps:
      - uses: actions/checkout@v4

      # OIDC: the three values are identifiers (no password); kept as repository secrets.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "main-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep \
            --parameters location="${{ vars.AZURE_LOCATION }}" \
                         budgetContactEmail="${{ secrets.BUDGET_CONTACT_EMAIL }}" \
                         siteCustomDomain="${{ vars.SITE_CUSTOM_DOMAIN }}" \
            --query properties.outputs -o json > outputs.json
          cat outputs.json

      - name: Read outputs
        id: out
        run: |
          for k in functionAppName functionAppHostName storageAccountName staticWebsiteEndpoint staticWebAppName staticWebAppDefaultHostname; do
            echo "$k=$(jq -r ".$k.value" outputs.json)" >> "$GITHUB_OUTPUT"
          done

      # Static website hosting is a blob data-plane property: it cannot be set through ARM/Bicep.
      # Shared keys are disabled on the account, so this uses Entra auth (--auth-mode login) and
      # needs "Storage Blob Data Contributor" for the deploying principal (see docs/DEPLOY.md).
      # Idempotent; also creates the $web container. The $web container only holds the
      # rendered feeds (feeds/<hash>.ics); there is no index or 404 page to serve.
      - name: Enable static website hosting
        run: |
          az storage blob service-properties update \
            --account-name "${{ steps.out.outputs.storageAccountName }}" \
            --static-website \
            --index-document index.html \
            --auth-mode login

  api:
    needs: infra
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # .funcignore keeps site/, tests/, .venv/, infra/, docs/ out of the package.
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infra.outputs.functionAppName }}
          package: .
          sku: flexconsumption
          remote-build: true
          scm-do-build-during-deployment: true

  site:
    needs: infra
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Resolve site URL
        id: url
        run: |
          if [ -n "${{ vars.SITE_CUSTOM_DOMAIN }}" ]; then
            echo "site=https://${{ vars.SITE_CUSTOM_DOMAIN }}" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://${{ needs.infra.outputs.staticWebAppDefaultHostname }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        working-directory: site
        env:
          HUGO_PARAMS_APIBASE: https://${{ needs.infra.outputs.functionAppHostName }}
        run: hugo --minify --gc --baseURL "${{ steps.url.outputs.site }}"

      # The SWA action reads staticwebapp.config.json from the app_location folder, so copy it in,
      # substituting the real API and feed hosts into the Content-Security-Policy connect-src.
      - name: Copy SWA config
        run: |
          FEED_BASE="${{ needs.infra.outputs.staticWebsiteEndpoint }}"
          FEED_BASE="${FEED_BASE%/}"
          sed -e "s|https://REPLACE-ME.azurewebsites.net|https://${{ needs.infra.outputs.functionAppHostName }}|g" \
              -e "s|https://REPLACE-ME.blob.core.windows.net|${FEED_BASE}|g" \
              staticwebapp.config.json > site/public/staticwebapp.config.json
          grep -c REPLACE-ME site/public/staticwebapp.config.json && exit 1 || true

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token
        id: token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ needs.infra.outputs.staticWebAppName }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: site/public
          skip_app_build: true
          skip_api_build: true
          output_location: ''
