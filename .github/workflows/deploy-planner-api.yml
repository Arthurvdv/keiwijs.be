name: Deploy planner API

on:
  push:
    branches: [main]
    paths:
      - 'planner/**'
      - '.github/workflows/deploy-planner-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-planner-api
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  DEPLOYMENT_NAME: keiwijs-infra

jobs:
  api:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The infra deployment may be running in parallel (a push that touches infra/ and planner/).
      - name: Wait for infra deployment
        id: infra
        run: |
          for i in $(seq 1 40); do
            state=$(az deployment group show -g "$AZURE_RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.provisioningState -o tsv 2>/dev/null || echo "Missing")
            case "$state" in
              Succeeded) break ;;
              Failed|Canceled) echo "infra deployment is $state"; exit 1 ;;
              *) echo "infra deployment: $state, waiting..."; sleep 30 ;;
            esac
          done
          [ "$state" = "Succeeded" ] || { echo "infra deployment not ready; run 'Deploy infra' first"; exit 1; }
          echo "functionAppName=$(az deployment group show -g "$AZURE_RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.functionAppName.value -o tsv)" >> "$GITHUB_OUTPUT"

      # planner/.funcignore keeps tests/, tools/, .venv/ and docs out of the package.
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.functionAppName }}
          package: planner
          sku: flexconsumption
          remote-build: true
          scm-do-build-during-deployment: true
