name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - run: uv python install 3.13

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run mypy

      - name: Start Azurite
        run: |
          npm i -g azurite
          azurite --silent --location /tmp/azurite &
          sleep 3

      - name: Unit tests
        env:
          STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
        run: uv run pytest -q

      # Non-blocking: advisory vulnerability scan. A new CVE in a dependency must not
      # break unrelated PRs; Dependabot raises the fix PR.
      - name: pip-audit (advisory)
        continue-on-error: true
        run: uv run pip-audit

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build site
        working-directory: site
        env:
          HUGO_PARAMS_APIBASE: https://example.azurewebsites.net
        run: hugo --minify --gc --baseURL https://example.azurestaticapps.net

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint
        run: az bicep lint --file infra/main.bicep
